name: AixScan CI Pipeline Test

on:
  push:
    branches:
      - sb-sandbox
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline Build Test
        run: |
          python model_training/test_pipeline.py

      - name: Upload TFLite Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aixscan-tflite-model
          path: aixscan_model.tflite