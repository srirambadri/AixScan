<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome — Enter Your Details</title>
<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #0f766e;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
    }
    .card {
        background: #fff;
        border-radius: 12px;
        padding: 40px;
        width: 360px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        text-align: center;
    }
    h1 { font-size: 22px; margin-bottom: 6px; color: #111; }
    p.sub { color: #555; margin-bottom: 24px; font-size: 14px; }
    input {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
        box-sizing: border-box;
    }
    button {
        width: 100%;
        padding: 12px;
        margin-top: 16px;
        background: #0f766e;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
    }
    button:hover { background: #115e59; }
    .error { color: #c0392b; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
    <div class="card">
        <h1>Thanks for recycling!</h1>
        <p class="sub">Enter your details to receive your reward.</p>

        <form action="/submit" method="POST">
            <input type="hidden" name="session_id" value="{{ session_id }}">
            <input type="text" name="name" placeholder="Full Name" required autofocus>
            <input type="email" name="email" placeholder="Email Address" required>
            <button type="submit">Submit</button>
        </form>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
